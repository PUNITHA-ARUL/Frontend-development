    <script>
function doubleOdds(numbers) {
    // Write code here
 let number=[]
 for(let i=0; i< numbers.length; i++){
    if(numbers[i] % 2 !==0){
        number.push(numbers[i]*2)

    }
    else{
        number.push(numbers[i])
    }
    
 }
 return number;
}</script>
