<html>
<head>
    <title>Font Styles</title>
    <style>
        /* Add your CSS code here */
        h1{
            color: darkblue;
        }
        .description{
            color: green;
        }
        .bestseller{
            color: pink;
        }
        .new-release{
            color: gray

    <ul>
        <li class="bestseller">The Great Gatsby</li>
        <li>To Kill a Mockingbird</li>
        <li class="new-release">The Midnight Library</li>
    </ul>
</body>
</html>
