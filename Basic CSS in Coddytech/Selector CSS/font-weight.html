<!DOCTYPE html>
<html>
<head>
    <title>Font Weight Demonstration</title>
    <style>
        /* Write your CSS rules here */
        .light-text{
            font-weight: 300;
        }
        .medium-text{
            font-weight: normal;
        }
        .heavy-text{
            font-weight: bold;
        }
        
    </style>
</head>
<body>
    <p class="light-text">This text demonstrates font-weight: 300</p>
    <p class="medium-text">This text demonstrates font-weight: normal</p>
    <p class="heavy-text">This text demonstrates font-weight: bold</p>
</body>
</html>
