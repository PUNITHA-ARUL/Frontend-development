<html>
<head>
    <title>Blog Post Styling</title>
    <style>
        /* Write your CSS rules here */
        h1{
            text-align: center;
        }
        p{ 
            text-align: left;
        }
        blockquote{
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>My Blog Post</h1>
    <p>Welcome to my blog post. This is an introduction to the topic I'll be discussing today.</p>
    <blockquote>The greatest glory in living lies not in never falling, but in rising every time we fall.</blockquote>
</body>
</html>
